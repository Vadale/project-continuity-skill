<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img"><title>Project Continuity</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#192c42"/></linearGradient></defs><rect width="1280" height="640" fill="url(#bg)"/><g font-family="DejaVu Sans,sans-serif"><rect x="62" y="65" width="48" height="5" rx="2" fill="#86c5ff"/><text x="62" y="112" fill="#b1bfd3" font-size="17" font-weight="400">VADALE / OPEN SOURCE AGENT SKILLS</text><text x="62" y="213" fill="#f2f5fb" font-size="52" font-weight="700">Project</text><text x="62" y="280" fill="#f2f5fb" font-size="52" font-weight="700">Continuity</text><text x="65" y="376" fill="#c5d0df" font-size="21" font-weight="400">Resume from current evidence.</text><text x="65" y="411" fill="#c5d0df" font-size="21" font-weight="400">Keep useful past results.</text><text x="65" y="446" fill="#c5d0df" font-size="21" font-weight="400">Finish the next authorized step.</text><rect x="65" y="518" width="490" height="45" rx="22" fill="#86c5ff"/><text x="85" y="548" fill="#101b30" font-size="18" font-weight="600">Instructions you can inspect. Outputs too.</text><rect x="696" y="155" width="522" height="365" rx="22" fill="#101929" stroke="#3b4c66"/><text x="727" y="197" fill="#86c5ff" font-size="14" font-weight="600">ILLUSTRATIVE WORKFLOW</text><text x="728" y="268" fill="#f2f5fb" font-size="24" font-weight="600">Old receipt</text><text x="1020" y="268" fill="#86c5ff" font-size="19" font-weight="600">PASSED</text><path d="M728 289h458" stroke="#3b4c66"/><text x="728" y="343" fill="#f2f5fb" font-size="24" font-weight="600">Current figure</text><text x="1020" y="343" fill="#86c5ff" font-size="19" font-weight="600">MISSING</text><path d="M728 364h458" stroke="#3b4c66"/><text x="728" y="418" fill="#f2f5fb" font-size="24" font-weight="600">Next action</text><text x="1020" y="418" fill="#86c5ff" font-size="19" font-weight="600">REBUILD</text><text x="728" y="489" fill="#c5d0df" font-size="17" font-weight="400">Scope and limitations stay explicit.</text> </g></svg>
